name: Release to crates.io

on:
  push:
    tags: ["v*"]

jobs:

  # The release guard. version-root names the directory whose manifest
  # carries the version this repository publishes; the default is the root.
  release-guard:
    name: The release guard
    uses: macula-io/macula-ci-images/.github/workflows/release-guard.yml@2660ee4ce1c51ce3d2bf14043ebc8a2784065cd9
  publish:
    needs: [release-guard]
    name: publish macula-craft-collab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag version matches Cargo.toml
        run: |
          PACKAGE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "macula-craft-collab") | .version')
          if [ "$PACKAGE_VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME#v} is not the crate version $PACKAGE_VERSION"
            exit 1
          fi
      # The share tests dial macula-go's in-process stations
      # (tests/teststation), built to target/teststation first.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/teststation/go.mod
          cache-dependency-path: tests/teststation/go.sum
      - run: ./scripts/build-teststation.sh
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo publish --dry-run --locked
      # CRATES_IO_TOKEN: a plain crates.io API token; Trusted Publishing can
      # replace it after the first release exists.
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
