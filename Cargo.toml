[workspace]
# Single-crate workspace root, shaped like craft-libs': future members inherit
# the lint table below through `[lints] workspace = true`.
members = ["."]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[package]
name = "macula-craft-collab"
version = "0.4.1"
edition = "2024"
license = "Apache-2.0"
description = "Co-edit documents over the Macula mesh: the transport, identity, grants and realm membership for the macula-craft-seam collaboration seam."
repository = "https://github.com/macula-io/macula-craft-collab"
readme = "README.md"
keywords = ["collaboration", "macula", "mesh", "editor", "p2p"]
categories = ["text-editors", "network-programming"]
exclude = [".github"]

[lints]
workspace = true

[dependencies]
# the collaboration seam (code keeps the craft_collab name)
craft-collab = { package = "macula-craft-seam", version = "0.4" }
# released crates only
macula-rust = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
sha2 = "0.11"
getrandom = "0.2"
minreq = { version = "3", features = ["https-rustls"] }
# minreq's TLS; aws-lc-rs is installed as the process provider (realm/session.rs)
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }

[dev-dependencies]
# same versions macula-rust uses, so the fake KeyStore in tests is its trait's types
macula-mldsa = "0.3"
keyring = "4"
tempfile = "3"
